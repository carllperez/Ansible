---
- name: Configure reusable CORE TAAS trunk ports
  hosts: "{{ target_device | default('NO_TARGET_SELECTED') }}"
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Validate TAAS monitor and management address
      assert:
        that:
          - inventory_hostname == target_device
          - "'taas' in group_names"
          - monitor is defined
          - (monitor | int) >= 1
          - (monitor | int) <= 254
          - (monitor | string) == ((monitor | int) | string)
          - (ansible_host | string) == ('10.' ~ (monitor | string) ~ '.1.2')
        fail_msg: "TAAS inventory safety check failed for {{ inventory_hostname }}."

  tasks:
    - name: Configure Fa0/10-12 as trunks
      ios_config:
        parents:
          - interface range FastEthernet0/10 - 12
        lines:
          - no shutdown
          - switchport trunk encapsulation dot1q
          - switchport mode trunk

    - name: Verify trunks
      ios_command:
        commands:
          - show interfaces trunk
      register: trunk_verification

    - name: Display trunk verification
      debug:
        var: trunk_verification.stdout_lines

    - name: Save configuration
      ios_config:
        save_when: modified
