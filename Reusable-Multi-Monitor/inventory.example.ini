[baba]
baba71 ansible_host=10.71.1.4 monitor=71
baba72 ansible_host=10.72.1.4 monitor=72

[taas]
taas71 ansible_host=10.71.1.2 monitor=71
taas72 ansible_host=10.72.1.2 monitor=72

[cisco:children]
baba
taas

[cisco:vars]
ansible_user=admin
ansible_password=pass
ansible_connection=network_cli
ansible_network_os=ios
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc -o MACs=+hmac-sha1'

# Camera identifiers are deliberately omitted. Add the two real, distinct
# values to a BABA host only after they are known and reviewed:
# camera6_client_identifier=001a.1111.2222 camera8_client_identifier=001a.3333.4444
