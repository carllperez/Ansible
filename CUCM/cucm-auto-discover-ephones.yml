---
- name: Discover the two Day 1 phones from their fixed BABA ports
  hosts: baba
  gather_facts: false

  tasks:
    - name: Read CDP details from Day 1 phone ports Fa0/5 and Fa0/7
      ios_command:
        commands:
          - show cdp neighbors FastEthernet0/5 detail
          - show cdp neighbors FastEthernet0/7 detail
      register: day1_phone_cdp

    - name: Extract SEP MAC identifiers from both ports
      set_fact:
        phone1_sep_matches: >-
          {{ day1_phone_cdp.stdout[0] |
             regex_findall('(?i)Device ID:[ ]*SEP([0-9A-F]{12})') }}
        phone2_sep_matches: >-
          {{ day1_phone_cdp.stdout[1] |
             regex_findall('(?i)Device ID:[ ]*SEP([0-9A-F]{12})') }}

    - name: Require exactly one different Cisco phone on each Day 1 port
      assert:
        that:
          - phone1_sep_matches | length == 1
          - phone2_sep_matches | length == 1
          - (phone1_sep_matches[0] | upper) != (phone2_sep_matches[0] | upper)
        fail_msg: >-
          STOPPED: automatic discovery requires exactly one SEP phone on BABA
          Fa0/5 and one different SEP phone on BABA Fa0/7. Check the cables,
          power, CDP, and port assignments before changing CUCM.

    - name: Convert discovered MAC addresses to Cisco dotted format
      set_fact:
        discovered_phone1_mac: >-
          {{ (phone1_sep_matches[0][0:4] ~ '.' ~
              phone1_sep_matches[0][4:8] ~ '.' ~
              phone1_sep_matches[0][8:12]) | upper }}
        discovered_phone2_mac: >-
          {{ (phone2_sep_matches[0][0:4] ~ '.' ~
              phone2_sep_matches[0][4:8] ~ '.' ~
              phone2_sep_matches[0][8:12]) | upper }}

    - name: Display the automatic Day 1 port-to-ephone mapping
      debug:
        msg:
          - "BABA Fa0/5 -> ephone 1 -> {{ discovered_phone1_mac }}"
          - "BABA Fa0/7 -> ephone 2 -> {{ discovered_phone2_mac }}"

- name: Assign the discovered phones to CUCM and reload them
  hosts: cucm
  gather_facts: false

  vars:
    phone1_mac: "{{ hostvars['baba']['discovered_phone1_mac'] }}"
    phone2_mac: "{{ hostvars['baba']['discovered_phone2_mac'] }}"

  pre_tasks:
    - name: Recheck the two discovered addresses before changing CUCM
      assert:
        that:
          - phone1_mac | length == 14
          - phone2_mac | length == 14
          - phone1_mac != phone2_mac
        fail_msg: "STOPPED: CDP did not provide two different dotted MAC addresses."

  tasks:
    - name: Assign the Fa0/5 phone to Day 1 ephone 1
      ios_config:
        parents:
          - ephone 1
        lines:
          - no mac-address
          - "mac-address {{ phone1_mac }}"
          - type 8945
          - button 1:8 2:7 3:6 4:5
        match: none

    - name: Assign the Fa0/7 phone to Day 1 ephone 2
      ios_config:
        parents:
          - ephone 2
        lines:
          - no mac-address
          - "mac-address {{ phone2_mac }}"
          - type 8945
          - button 1:4 2:3 3:2 4:1
        match: none

    - name: Recreate the Day 1 phone configuration files
      ios_config:
        parents:
          - telephony-service
        lines:
          - create cnf-files

    - name: Restart both automatically assigned Day 1 phones
      ios_config:
        parents:
          - "ephone {{ item }}"
        lines:
          - restart
      loop:
        - 1
        - 2

    - name: Save the automatically discovered assignments
      ios_config:
        save_when: modified
