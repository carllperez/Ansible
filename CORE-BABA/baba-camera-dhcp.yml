---
# DO NOT RUN UNTIL THE REAL CAMERA CLIENT IDENTIFIERS ARE KNOWN.
# DAY1-May5-SirRob.txt uses 001a.xxxx.yyyy as placeholders.

- name: Configure CORE BABA camera DHCP reservations
  hosts: baba
  gather_facts: false

  vars:
    camera6_client_identifier: "001a.xxxx.yyyy"
    camera8_client_identifier: "001a.xxxx.yyyy"

  pre_tasks:
    - name: Stop until two real camera identifiers are reviewed
      assert:
        that:
          - "'xxxx' not in camera6_client_identifier"
          - "'xxxx' not in camera8_client_identifier"
          - camera6_client_identifier != camera8_client_identifier
        fail_msg: "DO NOT RUN: replace both camera identifiers with real, distinct reviewed values first."

  tasks:
    - name: Enable IP routing
      ios_config:
        lines:
          - ip routing

    - name: Configure CAMERA6 DHCP reservation
      ios_config:
        parents:
          - ip dhcp pool CAMERA6
        lines:
          - host 10.~~.50.6 255.255.255.0
          - "client-identifier {{ camera6_client_identifier }}"

    - name: Configure CAMERA8 DHCP reservation
      ios_config:
        parents:
          - ip dhcp pool CAMERA8
        lines:
          - host 10.~~.50.8 255.255.255.0
          - "client-identifier {{ camera8_client_identifier }}"

    - name: Verify DHCP bindings
      ios_command:
        commands:
          - show ip dhcp binding
      register: camera_dhcp_verification

    - name: Display DHCP binding verification
      debug:
        var: camera_dhcp_verification.stdout_lines

    - name: Save configuration
      ios_config:
        save_when: modified
